<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nestora</title>

    <meta name="description" content="Login to your Nestora account.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                NESTORA
            </div>

            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Login Section -->
    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-heading">
                    <p class="section-label">WELCOME TO NESTORA</p>

                    <h1>Welcome Back.</h1>

                    <p>
                        Login to your Nestora account to manage your
                        inquiries and explore your design journey.
                    </p>
                </div>


                <form id="loginForm" class="auth-form">

                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="loginPassword">Password</label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <div class="auth-options">
                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>
                    </div>


                    <button type="submit" class="btn auth-btn">
                        Login
                    </button>


                    <p id="loginMessage" class="auth-message"></p>

                </form>


                <div class="auth-create">

                    <p>Don't have an account?</p>

                    <a href="create-account.html">
                        Create an Account
                    </a>

                </div>


                <div class="auth-back">
                    <a href="index.html">
                        ← Back to Nestora
                    </a>
                </div>

            </div>

        </section>

    </main>


    <!-- Login Script -->
    <script src="script.JS"></script>

</body>
</html>
