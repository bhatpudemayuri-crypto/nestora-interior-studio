<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Nestora</title>

    <meta name="description" content="Create your Nestora account.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                NESTORA
            </div>

            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Create Account Section -->
    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-heading">

                    <p class="section-label">
                        WELCOME TO NESTORA
                    </p>

                    <h1>Create Your Account.</h1>

                    <p>
                        Create your Nestora account to manage your
                        inquiries and keep track of your design journey.
                    </p>

                </div>


                <form id="createAccountForm" class="auth-form">

                    <div class="form-group">

                        <label for="signupName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn auth-btn"
                    >
                        Create Account
                    </button>


                    <p
                        id="signupMessage"
                        class="auth-message"
                    ></p>

                </form>


                <div class="auth-create">

                    <p>
                        Already have an account?
                    </p>

                    <a href="login.html">
                        Login
                    </a>

                </div>


                <div class="auth-back">

                    <a href="index.html">
                        ← Back to Nestora
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.JS"></script>

</body>
</html>
